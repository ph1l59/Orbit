name: Build

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Orbit.exe
        run: dotnet publish src/Orbit/Orbit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Orbit
          path: publish/Orbit.exe

      - name: Attach Orbit.exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: publish/Orbit.exe
